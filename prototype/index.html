<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyWorker — Реестр операторов (прототип v3)</title>
<style>
  :root{
    --accent:#020A0A; --accent-dark:#000; --ink:#1A1D21; --muted:#7A828C;
    --line:#EAECEF; --bg:#F4F5F7; --card:#FFFFFF; --star:#EAB308; --ok:#15803D;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;padding-bottom:70px}
  a{color:inherit;text-decoration:none}

  header{background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
  .hwrap{max-width:1200px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:12px}
  .logo{display:flex;align-items:center;gap:9px;font-weight:800;font-size:18px;white-space:nowrap}
  .logo img{width:30px;height:30px;object-fit:contain}
  .geo{display:flex;align-items:center;gap:4px;color:var(--muted);font-size:14px;white-space:nowrap}
  .search{flex:1;display:flex;align-items:center;gap:8px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:0}
  .search input{border:0;background:transparent;outline:none;width:100%;font-size:15px}
  .btn{background:var(--accent);color:#fff;border:0;border-radius:12px;padding:10px 18px;font-weight:600;font-size:14px;cursor:pointer;white-space:nowrap}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--line)}

  .segwrap{background:var(--card);border-bottom:1px solid var(--line)}
  .seg{max-width:1200px;margin:0 auto;padding:0 14px;display:flex;gap:24px}
  .seg div{padding:12px 2px;font-weight:600;font-size:15px;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
  .seg div.on{color:var(--accent);border-color:var(--accent)}

  .cats{max-width:1200px;margin:0 auto;padding:14px;display:grid;grid-auto-flow:column;grid-template-rows:1fr 1fr;gap:14px 10px;overflow-x:auto;grid-auto-columns:72px}
  .cat{display:flex;flex-direction:column;align-items:center;gap:6px;cursor:pointer;text-align:center}
  .cat .ic{width:58px;height:58px;border-radius:16px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:25px}
  .cat.on .ic{background:var(--accent);border-color:var(--accent)}
  .cat span{font-size:11px;color:var(--muted);line-height:1.2;max-width:70px}
  .cats::-webkit-scrollbar{display:none}

  .toolbar{max-width:1200px;margin:0 auto;padding:6px 14px;display:flex;align-items:center;justify-content:space-between;gap:12px}
  .toolbar .count{font-size:13px;color:var(--muted)}
  .sort{font-size:13px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px}

  .grid{max-width:1200px;margin:0 auto;padding:6px 14px 30px;display:grid;gap:12px;grid-template-columns:repeat(4,1fr)}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;cursor:pointer;transition:.15s}
  .card:hover{box-shadow:0 8px 22px rgba(20,25,35,.08)}
  .ph{position:relative;aspect-ratio:1;background:#EDEFF2;display:grid;place-items:center}
  .ph .ini{width:74px;height:74px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--accent);display:grid;place-items:center;font-size:26px;font-weight:800}
  .fav{position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;font-size:15px;color:var(--muted)}
  .vbadge{position:absolute;top:8px;left:8px;background:#fff;color:var(--ok);border-radius:8px;padding:3px 7px;font-size:11px;font-weight:700;border:1px solid #DCEAE0}
  .cb{padding:10px 11px 12px;display:flex;flex-direction:column;gap:4px}
  .price{font-size:17px;font-weight:800}
  .price small{font-size:12px;color:var(--muted);font-weight:500}
  .price.req{font-size:15px;color:var(--muted);font-weight:700}
  .nm{font-size:14px;font-weight:600;line-height:1.25;overflow:hidden;text-overflow:ellipsis;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;min-height:34px}
  .rt{display:flex;align-items:center;gap:5px;font-size:13px;font-weight:700}
  .rt .st{color:var(--star)}
  .rt .rev{color:var(--muted);font-weight:400}
  .reg{font-size:12px;color:var(--muted)}

  .overlay{position:fixed;inset:0;background:rgba(15,20,30,.5);display:none;align-items:flex-end;justify-content:center;z-index:40}
  .overlay.open{display:flex}
  .modal{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:20px 20px 0 0}
  .mhero{aspect-ratio:16/9;background:#EDEFF2;display:grid;place-items:center;position:relative}
  .mhero .ini{width:92px;height:92px;border-radius:50%;background:var(--card);border:1px solid var(--line);color:var(--accent);display:grid;place-items:center;font-size:34px;font-weight:800}
  .mclose{position:absolute;top:12px;right:12px;width:34px;height:34px;border-radius:50%;background:#fff;border:0;font-size:18px;cursor:pointer}
  .mbody{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
  .mname{font-size:22px;font-weight:800}
  .msub{color:var(--muted);font-size:14px;margin-top:2px}
  .mprice{font-size:20px;font-weight:800;color:var(--ink)}
  .sec h4{font-size:12px;text-transform:uppercase;letter-spacing:.03em;color:var(--muted);margin-bottom:8px}
  .badges{display:flex;flex-wrap:wrap;gap:8px}
  .badge{background:#EAF7F1;color:var(--ok);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600}
  .badge.gray{background:var(--bg);color:var(--ink);font-weight:500}
  .specs{display:flex;flex-direction:column;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .srow{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;font-size:14px;border-bottom:1px solid var(--line)}
  .srow:last-child{border-bottom:0}
  .srow span{color:var(--muted)}
  .srow b{color:var(--ink);text-align:right}
  .gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
  .gallery div{aspect-ratio:1;border-radius:10px;background:#EDF0F3;display:grid;place-items:center;color:var(--muted);font-size:12px}
  .mfoot{padding:14px 20px 24px;display:flex;gap:10px}
  .mfoot .btn{flex:1;padding:14px}

  .tabbar{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:none;justify-content:space-around;padding:8px 0 10px;z-index:30}
  .tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
  .tabbar a.on{color:var(--accent)}
  .tabbar .ti{font-size:20px}

  @media(max-width:1000px){.grid{grid-template-columns:repeat(3,1fr)}}
  @media(max-width:720px){.grid{grid-template-columns:1fr 1fr}.enter{display:none}.geo{display:none}.tabbar{display:flex}}
</style>
</head>
<body>
<header>
  <div class="hwrap">
    <div class="logo"><img src="brand/logo-horizontal-black.svg" alt="SkyWorker" style="height:26px;width:auto"></div>
    <div class="geo">📍 Астана ⌄</div>
    <label class="search">🔎 <input placeholder="Поиск оператора, услуги, региона"></label>
    <button class="btn enter">Войти</button>
  </div>
  <div class="segwrap"><div class="seg">
    <div class="on" onclick="setTab(this,'op')">Операторы</div>
    <div onclick="setTab(this,'sv')">Услуги</div>
  </div></div>
</header>

<div class="cats" id="cats"></div>

<div class="toolbar">
  <div class="count" id="count"></div>
  <select class="sort"><option>По рейтингу</option><option>Ближе ко мне</option><option>Дешевле</option><option>Больше опыта</option></select>
</div>

<div class="grid" id="grid"></div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>

<nav class="tabbar">
  <a class="on"><span class="ti">🗂</span>Каталог</a>
  <a><span class="ti">♡</span>Избранное</a>
  <a><span class="ti">📋</span>Заявки</a>
  <a><span class="ti">👤</span>Профиль</a>
</nav>

<script>
// направления SkyWorker (канон, без военки)
const cats=[["🧭","Все"],["🌾","Агро"],["🎥","Фото/видео"],["📐","Геодезия"],["🗺","Картография"],["🏗","Строительство"],["🔍","Мониторинг"],["🚨","Поиск-спас"],["🛡","Охрана"],["🌲","Лес"],["📦","Доставка"],["➕","Другое"]];
document.getElementById('cats').innerHTML=cats.map((c,i)=>`<div class="cat ${i==1?'on':''}"><div class="ic">${c[0]}</div><span>${c[1]}</span></div>`).join('');

const data={
 op:[
  {ini:"АЖ",name:"Асхат Жумабеков",price:"от 18 000 ₸",unit:"/ день",type:"Оператор · со своим БАС",dirs:["Агро","Опрыскивание","Десикация"],region:"Акмолинская обл.",rate:"4.9",rev:37,cat:"Категория 3",pilot:"Свидетельство внешнего пилота",equip:"DJI Agras T70",exp:"Опыт 3 сезона · ~12 000 га",about:"Оператор-агро. Гербициды, фунгициды, десикация, внесение. Готов на сезон и разовые выезды.",specs:[["Категория","3"],["Опыт работы","4 года"],["Опыт с агродронами","3 сезона"],["Обработано","12 000+ га"],["Работает на","DJI Agras T70"],["Работал на","T50 / T100"],["Собственный дрон","Да"],["Дрон зарегистрирован","Да · KZ-A1234"],["Бак-разбрасыватель","Да"],["Автомобиль + прицеп","Да"],["Ёмкость для воды","Да"]],services:"Гербициды / фунгициды / инсектициды / десикация / удобрения / семена"},
  {ini:"ДО",name:"Данияр Оспанов",price:"от 12 000 ₸",unit:"/ день",type:"Оператор · по найму",dirs:["Агро","Опрыскивание"],region:"Костанайская обл.",rate:"4.7",rev:18,cat:"Категория 1",pilot:"—",equip:"Работает на технике заказчика",exp:"Опыт 2 сезона",about:"Оператор-опрыскиватель. Ищу сезонную занятость."},
  {ini:"МК",name:"Марат Калиев",price:"по запросу",req:true,unit:"",type:"Оператор · по найму",dirs:["Агро","Картография","Мониторинг"],region:"Акмолинская обл.",rate:"4.8",rev:26,cat:"Категория 2",pilot:"Свидетельство внешнего пилота",equip:"Свой DJI Mavic 3M (NDVI)",exp:"Опыт 3 сезона · агроскаутинг",about:"Оператор-универсал: обработка + карты полей и мониторинг NDVI."},
  {ini:"НБ",name:"Нурлан Байбек",price:"от 15 000 ₸",unit:"/ день",type:"Оператор · по найму",dirs:["Агро","Десикация"],region:"Северо-Казахстанская обл.",rate:"5.0",rev:9,cat:"Категория 1",pilot:"—",equip:"Работает на технике заказчика",exp:"Опыт 1 сезон",about:"Начинающий оператор, допуск есть, работаю аккуратно."},
 ],
 sv:[
  {ini:"JD",name:"ТОО «JEDI» — обработка полей под ключ",price:"от 2 700 ₸",unit:"/ га",type:"Услуги · компания",dirs:["Агро","Опрыскивание","Десикация","Внесение"],region:"Астана · по всему РК",rate:"4.9",rev:64,cat:"Категория 3",pilot:"Свидетельство внешнего пилота",equip:"DJI Agras T50 / T100 · 3 бригады",exp:"3 года · до 400 га/смена на бригаду",about:"Обработка агродронами: сорняки, болезни, вредители, удобрения, десикация. Без заезда техники в поле, работа после дождя. Цена зависит от объёма (от 100 до 8000 га)."},
  {ini:"DS",name:"DronServis — агрообработка по области",price:"по запросу",req:true,unit:"",type:"Услуги · ИП",dirs:["Агро","Опрыскивание"],region:"Акмолинская обл.",rate:"4.8",rev:24,cat:"Категория 2",pilot:"Свидетельство внешнего пилота",equip:"DJI Agras T50",exp:"3 сезона",about:"Оперативный выезд по области. Цену считаем индивидуально под поле и объём."},
  {ini:"SK",name:"SkyAgro — внесение и мониторинг полей",price:"от 1 100 ₸",unit:"/ га",type:"Услуги · компания",dirs:["Агро","Картография","Мониторинг"],region:"Костанайская обл.",rate:"4.9",rev:41,cat:"Категория 3",pilot:"Свидетельство внешнего пилота",equip:"3× DJI Agras T40 · NDVI-дрон",exp:"5 сезонов · карты внесения",about:"Комплекс: съёмка полей, карты, дифференцированное внесение, обработка."},
 ],
};
let cur='op';
function render(){
 const arr=data[cur];
 document.getElementById('count').innerHTML=`Найдено <b>${arr.length}</b> · Агро`;
 document.getElementById('grid').innerHTML=arr.map((o,i)=>`
  <div class="card" onclick="openOp(${i})">
    <div class="ph"><div class="ini">${o.ini}</div><div class="fav">♡</div><div class="vbadge">✓ допуск</div></div>
    <div class="cb">
      <div class="price ${o.req?'req':''}">${o.price} ${o.unit?`<small>${o.unit}</small>`:''}</div>
      <div class="nm">${o.name}</div>
      <div class="rt"><span class="st">★</span>${o.rate}<span class="rev">(${o.rev})</span></div>
      <div class="reg">📍 ${o.region}</div>
    </div>
  </div>`).join('');
}
function setTab(el,t){document.querySelectorAll('.seg div').forEach(d=>d.classList.remove('on'));el.classList.add('on');cur=t;render();}
function openOp(i){
 const o=data[cur][i];
 document.getElementById('modal').innerHTML=`
  <div class="mhero"><div class="ini">${o.ini}</div><button class="mclose" onclick="closeOp()">✕</button><div class="vbadge">✓ допуск подтверждён</div></div>
  <div class="mbody">
    <div><div class="mname">${o.name}</div><div class="msub">${o.type} · 📍 ${o.region}</div>
      <div class="rt" style="margin-top:8px"><span class="st">★</span>${o.rate}<span class="rev">· ${o.rev} отзывов</span></div>
      <div class="mprice" style="margin-top:8px">${o.price} ${o.unit?`<small style="font-size:13px;color:var(--muted)">${o.unit}</small>`:''}</div></div>
    <div class="sec"><h4>Направления</h4><div class="badges">${o.dirs.map(d=>`<span class="badge gray">${d}</span>`).join('')}</div></div>
    <div class="sec"><h4>Допуски</h4><div class="badges"><span class="badge">${o.cat}</span>${o.pilot!=='—'?`<span class="badge">${o.pilot}</span>`:''}</div></div>
    ${o.specs?`<div class="sec"><h4>Характеристики</h4><div class="specs">${o.specs.map(s=>`<div class="srow"><span>${s[0]}</span><b>${s[1]}</b></div>`).join('')}</div></div>`:`<div class="sec"><h4>Оборудование</h4><div class="msub" style="color:var(--ink)">${o.equip}</div></div><div class="sec"><h4>Опыт</h4><div class="msub" style="color:var(--ink)">${o.exp}</div></div>`}
    ${o.services?`<div class="sec"><h4>Услуги</h4><div class="msub" style="color:var(--ink)">${o.services}</div></div>`:''}
    <div class="sec"><h4>О себе</h4><div class="msub" style="color:var(--ink)">${o.about}</div></div>
    <div class="sec"><h4>Портфолио</h4><div class="gallery"><div>фото</div><div>фото</div><div>видео</div></div></div>
  </div>
  <div class="mfoot"><button class="btn ghost">♡ В избранное</button><button class="btn">Связаться</button></div>`;
 document.getElementById('overlay').classList.add('open');
}
function closeOp(){document.getElementById('overlay').classList.remove('open');}
document.getElementById('overlay').addEventListener('click',e=>{if(e.target.id==='overlay')closeOp();});
render();
</script>
</body>
</html>
